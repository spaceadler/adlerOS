# Monica, from adlerOS's store: a personal CRM (the people in your life, what
# you talked about, birthdays). adlerOS's Contacts reads and writes it.
# adlerOS fills in .env (port, passwords, key) when it installs this.
services:
  monica:
    image: monica:4
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${PORT}:80"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      # Links in its emails; pages use whatever address you reach it at.
      APP_URL: http://localhost
      APP_TRUSTED_PROXIES: "*"
      APP_DISABLE_SIGNUP: "false"
      DB_HOST: db
      DB_DATABASE: monica
      DB_USERNAME: monica
      DB_PASSWORD: ${DB_PASSWORD}
      APP_TIMEZONE: ${TZ}
    volumes:
      - ./data:/var/www/html/storage
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_DATABASE: monica
      MARIADB_USER: monica
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
