# Uptime Kuma, from adlerOS's store: uptime monitoring and status pages.
# adlerOS fills in .env (port, timezone, passwords) when it installs this.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "${PORT}:3001"
    volumes:
      - ./data:/app/data
